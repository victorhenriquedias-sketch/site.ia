<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Futebol</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f5e9;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #2e7d32;
      color: white;
      padding: 20px;
      font-size: 24px;
    }

    .container {
      padding: 20px;
    }

    img {
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    p {
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

  <header>
    Futebol: O esporte mais popular do mundo
  </header>

  <div class="container">
    <h2>Uma imagem de futebol</h2>

    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccer_ball.svg" alt="Bola de futebol">

    <p>
      O futebol é um esporte jogado por duas equipes, cada uma com 11 jogadores.
      O objetivo é marcar gols no time adversário.
    </p>
  </div>

</body>
</html>
